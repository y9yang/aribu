name: aribu
channels:
  - conda-forge
dependencies:
  - python=3.14
  - pytorch-gpu
  # not imported; required by segmentation-models-pytorch, pinned to conda so pip does not install its own
  - torchvision
  - numpy
  - pandas
  - rasterio
  - geopandas
  - shapely
  - scikit-image
  - scipy
  - matplotlib
  - pillow
  - tqdm
  - ipykernel
  - ipywidgets
  - streamlit
  - pydeck
  - pytest
  - pip
  - pip:
      - segmentation-models-pytorch
      - -e .
