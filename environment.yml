name: aribu
channels:
  - conda-forge
dependencies:
  - python=3.14
  - pytorch-gpu          # NOT "pytorch": that resolves to the CPU build
  - torchvision
  - numpy
  - pandas
  - rasterio
  - geopandas            # event polygons, chip footprints, spatial joins
  - scikit-learn
  - scikit-image         # Otsu thresholding, speckle filtering
  - matplotlib
  - tqdm
  - ipykernel            # lets VS Code see this env as a notebook kernel
  - ipywidgets           # tqdm.auto's progress bars; without it tqdm warns and falls back
  - jupyterlab
  - streamlit
  - pytest               # test suite in tests/
  - pip
  - pip:
      - segmentation-models-pytorch
      # this project, installed editable; run conda env create from the repo root
      - -e .
